name: diag

# One-off diagnostics: read D1 row-read usage and the query plan behind the daily
# limit exhaustion. Temporary; removed once the fix is verified.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: D1 usage today
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          TODAY=$(date -u +%Y-%m-%d)
          YDAY=$(date -u -d '1 day ago' +%Y-%m-%d)
          echo "=== rows read today (per database) ==="
          Q="{\"query\":\"query{viewer{accounts(filter:{accountTag:\\\"$CF_ACCOUNT\\\"}){d1AnalyticsAdaptiveGroups(limit:50,filter:{date_geq:\\\"$TODAY\\\"},orderBy:[rowsRead_DESC]){sum{rowsRead rowsWritten}dimensions{databaseId}}}}}\"}"
          curl -sS -X POST "https://api.cloudflare.com/client/v4/graphql" \
            -H "Authorization: Bearer $CF_TOKEN" -H "content-type: application/json" \
            --data "$Q" | python3 -m json.tool | head -60

          echo "=== per-hour, last 24h ==="
          Q2="{\"query\":\"query{viewer{accounts(filter:{accountTag:\\\"$CF_ACCOUNT\\\"}){d1AnalyticsAdaptiveGroups(limit:200,filter:{date_geq:\\\"$YDAY\\\"},orderBy:[datetimeHour_ASC]){sum{rowsRead rowsWritten}dimensions{datetimeHour}}}}}\"}"
          curl -sS -X POST "https://api.cloudflare.com/client/v4/graphql" \
            -H "Authorization: Bearer $CF_TOKEN" -H "content-type: application/json" \
            --data "$Q2" | python3 -m json.tool | head -200

      - name: table row counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: app
        run: |
          cat > /tmp/q.sql <<'SQL'
          SELECT 'programs' t, COUNT(*) n FROM programs
          UNION ALL SELECT 'candidates', COUNT(*) FROM candidates
          UNION ALL SELECT 'assets', COUNT(*) FROM assets
          UNION ALL SELECT 'findings', COUNT(*) FROM findings
          UNION ALL SELECT 'evidence', COUNT(*) FROM evidence
          UNION ALL SELECT 'probes', COUNT(*) FROM probes
          UNION ALL SELECT 'ledger', COUNT(*) FROM ledger
          UNION ALL SELECT 'corpus', COUNT(*) FROM corpus
          UNION ALL SELECT 'corpus_digest', COUNT(*) FROM corpus_digest
          UNION ALL SELECT 'approvals', COUNT(*) FROM approvals
          UNION ALL SELECT 'hunts', COUNT(*) FROM hunts
          UNION ALL SELECT 'kv', COUNT(*) FROM kv
          UNION ALL SELECT 'sweep_hits', COUNT(*) FROM sweep_hits
          UNION ALL SELECT 'dust_scan', COUNT(*) FROM dust_scan
          UNION ALL SELECT 'desk_universe', COUNT(*) FROM desk_universe
          UNION ALL SELECT 'llm_log', COUNT(*) FROM llm_log
          ORDER BY n DESC;
          SQL
          npx --yes wrangler@4 d1 execute asterion --remote --env production --file /tmp/q.sql 2>&1 | tail -45
