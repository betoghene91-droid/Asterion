name: diag2

on:
  workflow_dispatch:

jobs:
  counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: app
        run: |
          for T in programs candidates assets findings evidence probes ledger corpus corpus_digest approvals hunts kv sweep_hits dust_scan desk_universe llm_log corpus_sources scope_snapshots; do
            N=$(npx --yes wrangler@4 d1 execute asterion --remote --env production --json \
              --command "SELECT COUNT(*) n FROM $T" 2>/dev/null \
              | python3 -c "import json,sys;d=json.load(sys.stdin);print(d[0]['results'][0]['n'])" 2>/dev/null || echo ERR)
            printf "%-18s %s\n" "$T" "$N"
          done

      - name: query plans for the hot queries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: app
        run: |
          plan () {
            echo "--- $1"
            npx --yes wrangler@4 d1 execute asterion --remote --env production --json \
              --command "EXPLAIN QUERY PLAN $1" 2>/dev/null \
              | python3 -c "import json,sys;d=json.load(sys.stdin);[print('   ',r.get('detail')) for r in d[0]['results']]" 2>/dev/null || echo "   ERR"
          }
          plan "SELECT COUNT(*) AS n FROM ledger"
          plan "SELECT kind, COUNT(*) AS n FROM ledger GROUP BY kind ORDER BY n DESC LIMIT 24"
          plan "SELECT seq, ts, kind, payload, prev_hash, hash FROM ledger ORDER BY seq ASC"
          plan "SELECT id, action, reason, status, requested_at, decided_at, operator FROM approvals ORDER BY requested_at DESC LIMIT 50"
          plan "SELECT COUNT(*) AS n FROM approvals WHERE status='pending'"
          plan "SELECT id, name, homepage, policy_text FROM programs WHERE status IN ('new','crawled') AND (next_check IS NULL OR next_check <= 1) AND id <> 'unscoped' AND instr(id,':')=0 AND homepage IS NOT NULL AND homepage <> 'https://unscoped' ORDER BY priority DESC, COALESCE(next_check,0) ASC LIMIT 20"
